[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13.13"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "beanie>=2.1.0",
    "chess>=1.11.2",
    "machineplay",
    "pydantic-settings>=2.14.0",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
]

[tool.uv.sources]
machineplay = { path = "../machineplay", editable = true }

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "testcontainers[mongodb]>=4.14.2",
    "pytest-cov>=7.1.0",
]

[tool.mypy]
python_version = "3.13"
files = ["."]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
